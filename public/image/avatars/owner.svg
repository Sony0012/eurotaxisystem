<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgOwner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgOwner)" stroke="#fcd34d" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadow)">
    <!-- Suit Body -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitGrad)"/>
    <!-- Shirt / Collar -->
    <polygon points="100,130 85,155 115,155" fill="#ffffff"/>
    <!-- Gold Tie -->
    <polygon points="100,140 104,175 100,182 96,175" fill="url(#crownGrad)"/>
    <!-- Head -->
    <ellipse cx="100" cy="98" rx="28" ry="32" fill="url(#skinGrad)"/>
    <!-- Hair -->
    <path d="M72 90 C72 65 82 60 100 60 C118 60 128 65 128 90 C128 80 120 72 100 72 C80 72 72 80 72 90 Z" fill="#451a03"/>
    <!-- Ears -->
    <circle cx="72" cy="100" r="6" fill="url(#skinGrad)"/>
    <circle cx="128" cy="100" r="6" fill="url(#skinGrad)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="96" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="110" cy="96" rx="3" ry="4" fill="#1e293b"/>
    <path d="M94 112 Q100 118 106 112" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- 3D Crown Floating on Top -->
    <g transform="translate(100, 48)">
      <polygon points="-22,12 -28,-6 -10,0 0,-14 10,0 28,-6 22,12" fill="url(#crownGrad)"/>
      <ellipse cx="0" cy="12" rx="22" ry="4" fill="#ca8a04"/>
      <!-- Jewels -->
      <circle cx="-14" cy="4" r="2.5" fill="#ef4444"/>
      <circle cx="0" cy="-3" r="3" fill="#3b82f6"/>
      <circle cx="14" cy="4" r="2.5" fill="#10b981"/>
    </g>
  </g>
</svg>
