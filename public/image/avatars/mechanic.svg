<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgMech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="suitMech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="skinMech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowMech" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgMech)" stroke="#fb7185" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowMech)">
    <!-- Overalls Body -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitMech)"/>
    <!-- Overalls Straps & T-Shirt -->
    <polygon points="100,130 85,155 115,155" fill="#334155"/>
    <rect x="68" y="145" width="10" height="40" rx="2" fill="#be123c"/>
    <rect x="122" y="145" width="10" height="40" rx="2" fill="#be123c"/>
    <circle cx="73" cy="152" r="2.5" fill="#f8fafc"/>
    <circle cx="127" cy="152" r="2.5" fill="#f8fafc"/>
    <!-- Head -->
    <ellipse cx="100" cy="98" rx="28" ry="32" fill="url(#skinMech)"/>
    <!-- Ears -->
    <circle cx="72" cy="100" r="6" fill="url(#skinMech)"/>
    <circle cx="128" cy="100" r="6" fill="url(#skinMech)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="98" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="110" cy="98" rx="3" ry="4" fill="#0f172a"/>
    <path d="M94 112 Q100 118 106 112" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Mechanic Work Cap / Visor -->
    <path d="M70 82 C70 54 84 50 100 50 C116 50 130 54 130 82 Z" fill="#e11d48"/>
    <!-- Cap Visor -->
    <path d="M66 80 C80 75 120 75 134 80 L140 85 C120 81 80 81 60 85 Z" fill="#9f1239"/>
    <!-- Wrench Tool Badge -->
    <g transform="translate(132, 142)">
      <circle cx="10" cy="10" r="14" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
      <path d="M6 14 L12 8 M7 7 L9 5 L11 7 L13 5 L15 7 L13 9 L15 11 L13 13 L11 11 L9 13 Z" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="14" cy="6" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
