<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgDisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="suitDisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="skinDisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowDisp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgDisp)" stroke="#2dd4bf" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowDisp)">
    <!-- Body Uniform -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitDisp)"/>
    <!-- Collar & Zip -->
    <polygon points="100,130 92,150 108,150" fill="#ffffff"/>
    <line x1="100" y1="150" x2="100" y2="185" stroke="#14b8a6" stroke-width="3"/>
    <!-- Head -->
    <ellipse cx="100" cy="95" rx="28" ry="32" fill="url(#skinDisp)"/>
    <!-- Hair -->
    <path d="M72 88 C72 62 84 56 100 56 C116 56 128 62 128 88 C128 78 120 70 100 70 C80 70 72 78 72 88 Z" fill="#292524"/>
    <!-- Ears -->
    <circle cx="72" cy="98" r="6" fill="url(#skinDisp)"/>
    <circle cx="128" cy="98" r="6" fill="url(#skinDisp)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="110" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <path d="M94 108 Q100 114 106 108" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Dispatcher Professional Headset with Mic -->
    <!-- Headband -->
    <path d="M68 94 C68 55 132 55 132 94" stroke="#0f172a" stroke-width="5" fill="none"/>
    <!-- Left & Right Ear Cushions -->
    <rect x="63" y="85" width="10" height="22" rx="4" fill="#0d9488"/>
    <rect x="127" y="85" width="10" height="22" rx="4" fill="#0d9488"/>
    <!-- Microphone boom curving to mouth -->
    <path d="M130 98 Q130 116 114 116" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="112" cy="116" rx="4.5" ry="3.5" fill="#f59e0b"/>
    <!-- Radio Signal badge -->
    <g transform="translate(132, 142)">
      <circle cx="10" cy="10" r="14" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
      <path d="M6 14 A6 6 0 0 1 6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M9 12 A3 3 0 0 1 9 8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="12" cy="10" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
