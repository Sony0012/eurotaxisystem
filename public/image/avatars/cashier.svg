<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgCash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="suitCash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="skinCash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowCash" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgCash)" stroke="#4ade80" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowCash)">
    <!-- Suit Body -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitCash)"/>
    <!-- Shirt / Collar -->
    <polygon points="100,130 85,155 115,155" fill="#ffffff"/>
    <!-- Gold / Green Tie -->
    <polygon points="100,140 104,175 100,182 96,175" fill="#eab308"/>
    <!-- Head -->
    <ellipse cx="100" cy="95" rx="28" ry="32" fill="url(#skinCash)"/>
    <!-- Hair -->
    <path d="M72 88 C72 60 85 54 100 54 C115 54 128 60 128 88 C128 78 120 68 100 68 C80 68 72 78 72 88 Z" fill="#78350f"/>
    <!-- Ears -->
    <circle cx="72" cy="98" r="6" fill="url(#skinCash)"/>
    <circle cx="128" cy="98" r="6" fill="url(#skinCash)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="110" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <path d="M94 108 Q100 114 106 108" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cashier / Peso Currency Badge -->
    <g transform="translate(132, 142)">
      <circle cx="10" cy="10" r="14" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
      <text x="10" y="15" font-size="14" font-family="Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">₱</text>
    </g>
  </g>
</svg>
