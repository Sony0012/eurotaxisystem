<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgMgr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="suitMgr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="skinMgr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowMgr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgMgr)" stroke="#38bdf8" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowMgr)">
    <!-- Suit Body -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitMgr)"/>
    <!-- Shirt / Collar -->
    <polygon points="100,130 85,155 115,155" fill="#ffffff"/>
    <!-- Blue Tie -->
    <polygon points="100,140 104,175 100,182 96,175" fill="#0284c7"/>
    <!-- Manager Gold ID Badge -->
    <rect x="62" y="152" width="16" height="20" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="65" y="155" width="10" height="3" rx="1" fill="#0284c7"/>
    <rect x="65" y="160" width="10" height="8" rx="1" fill="#cbd5e1"/>
    <!-- Head -->
    <ellipse cx="100" cy="95" rx="28" ry="32" fill="url(#skinMgr)"/>
    <!-- Hair -->
    <path d="M72 88 C72 60 85 54 100 54 C115 54 128 60 128 88 C128 78 120 68 100 68 C80 68 72 78 72 88 Z" fill="#1e293b"/>
    <!-- Ears -->
    <circle cx="72" cy="98" r="6" fill="url(#skinMgr)"/>
    <circle cx="128" cy="98" r="6" fill="url(#skinMgr)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="110" cy="94" rx="3" ry="4" fill="#0f172a"/>
    <path d="M93 108 Q100 114 107 108" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Briefcase / Management icon badge -->
    <g transform="translate(130, 140)">
      <circle cx="10" cy="10" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <path d="M5 8 L15 8 L15 15 L5 15 Z" fill="#ffffff"/>
      <path d="M8 8 L8 6 L12 6 L12 8" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
