<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgDriver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="suitDriver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinDriver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowDriver" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#d97706" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgDriver)" stroke="#f59e0b" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowDriver)">
    <!-- Body Uniform / Driver Jacket -->
    <path d="M40 185 C40 145 65 130 100 130 C135 130 160 145 160 185 Z" fill="url(#suitDriver)"/>
    <!-- Yellow Trim Lapel / Collar -->
    <polygon points="100,130 84,156 116,156" fill="#ffffff"/>
    <polygon points="100,136 90,156 110,156" fill="#f59e0b"/>
    <polygon points="100,144 94,156 106,156" fill="#ffffff"/>
    <!-- Gold Pilot / Taxi Tie -->
    <polygon points="100,154 104,180 100,185 96,180" fill="#d97706"/>
    <!-- Head -->
    <ellipse cx="100" cy="98" rx="28" ry="32" fill="url(#skinDriver)"/>
    <!-- Ears -->
    <circle cx="72" cy="100" r="6" fill="url(#skinDriver)"/>
    <circle cx="128" cy="100" r="6" fill="url(#skinDriver)"/>
    <!-- Face details -->
    <ellipse cx="90" cy="98" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="110" cy="98" rx="3" ry="4" fill="#0f172a"/>
    <!-- Confident Smile -->
    <path d="M93 112 Q100 118 107 112" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Classic Professional Taxi Driver Peaked Cap -->
    <!-- Cap Crown -->
    <path d="M68 84 C68 54 82 48 100 48 C118 48 132 54 132 84 Z" fill="#1e293b"/>
    <!-- Cap Gold Band -->
    <path d="M69 82 C80 80 120 80 131 82 L131 87 C120 85 80 85 69 87 Z" fill="#f59e0b"/>
    <!-- Cap Visor -->
    <path d="M66 85 C80 82 120 82 134 85 L140 90 C120 87 80 87 60 90 Z" fill="#0f172a"/>
    <!-- Gold Cap Badge / Star -->
    <circle cx="100" cy="68" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <!-- Steering Wheel Badge -->
    <g transform="translate(130, 138)">
      <circle cx="12" cy="12" r="15" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Steering Wheel Icon -->
      <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="2" fill="none"/>
      <circle cx="12" cy="12" r="2.5" fill="#ffffff"/>
      <line x1="12" y1="5" x2="12" y2="9.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="6" y1="15" x2="10" y2="13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="15" x2="14" y2="13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
