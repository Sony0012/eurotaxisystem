<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="suitSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="skinSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="avShadowSec" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9333ea" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgSec)" stroke="#e879f9" stroke-width="4"/>
  <!-- Character -->
  <g filter="url(#avShadowSec)">
    <!-- Top Hair Bun -->
    <circle cx="100" cy="46" r="16" fill="#4a044e"/>
    <!-- Suit Body -->
    <path d="M42 185 C42 145 66 132 100 132 C134 132 158 145 158 185 Z" fill="url(#suitSec)"/>
    <!-- V-Neck Blouse -->
    <polygon points="100,132 90,155 110,155" fill="#fdf4ff"/>
    <!-- Pearl Necklace -->
    <circle cx="94" cy="148" r="2" fill="#ffffff"/>
    <circle cx="100" cy="150" r="2" fill="#ffffff"/>
    <circle cx="106" cy="148" r="2" fill="#ffffff"/>
    <!-- Head -->
    <ellipse cx="100" cy="94" rx="26" ry="30" fill="url(#skinSec)"/>
    <!-- Elegant Hair with Side Curls -->
    <path d="M74 88 C74 58 84 52 100 52 C116 52 126 58 126 88 C126 112 118 124 116 124 C116 116 122 88 100 75 C78 88 84 116 84 124 C82 124 74 112 74 88 Z" fill="#4a044e"/>
    <!-- Ears & Pearl Earrings -->
    <circle cx="74" cy="96" r="5" fill="url(#skinSec)"/>
    <circle cx="126" cy="96" r="5" fill="url(#skinSec)"/>
    <circle cx="73" cy="99" r="2.5" fill="#ffffff"/>
    <circle cx="127" cy="99" r="2.5" fill="#ffffff"/>
    <!-- Eyes & Stylish Glasses -->
    <rect x="83" y="88" width="14" height="11" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1.8"/>
    <rect x="103" y="88" width="14" height="11" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1.8"/>
    <line x1="97" y1="93" x2="103" y2="93" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="90" cy="93" r="2.5" fill="#1e1b4b"/>
    <circle cx="110" cy="93" r="2.5" fill="#1e1b4b"/>
    <!-- Smile -->
    <path d="M94 108 Q100 114 106 108" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Clipboard & Pen Badge -->
    <g transform="translate(132, 142)">
      <circle cx="10" cy="10" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
      <rect x="6" y="5" width="8" height="11" rx="1.5" fill="#ffffff"/>
      <rect x="7.5" y="4" width="5" height="2" rx="0.5" fill="#581c87"/>
      <line x1="8" y1="8" x2="12" y2="8" stroke="#a855f7" stroke-width="1"/>
      <line x1="8" y1="10" x2="12" y2="10" stroke="#a855f7" stroke-width="1"/>
      <line x1="8" y1="12" x2="11" y2="12" stroke="#a855f7" stroke-width="1"/>
      <path d="M14 6 L17 9 L15 15 L12 15 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
