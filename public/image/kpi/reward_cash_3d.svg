<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="billGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="billTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#cashGlow)"/>
  <g filter="url(#cashShadow)">
    <g transform="rotate(8 100 100)">
      <!-- Bottom Bill Stack Face -->
      <rect x="44" y="80" width="112" height="64" rx="10" fill="#047857"/>
      
      <!-- Middle Stack -->
      <rect x="42" y="74" width="114" height="64" rx="10" fill="#059669"/>
      
      <!-- Top Bill -->
      <rect x="40" y="68" width="116" height="64" rx="10" fill="url(#billTop)"/>
      <rect x="46" y="74" width="104" height="52" rx="7" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      
      <!-- Currency Band Strap -->
      <rect x="88" y="66" width="22" height="68" rx="4" fill="#fbbf24"/>
      <line x1="94" y1="66" x2="94" y2="134" stroke="#d97706" stroke-width="1.5"/>
      <line x1="104" y1="66" x2="104" y2="134" stroke="#d97706" stroke-width="1.5"/>
      
      <!-- Bill Value -->
      <circle cx="68" cy="100" r="14" fill="#047857" opacity="0.25"/>
      <text x="68" y="106" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">₱</text>
      
      <text x="130" y="105" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">500</text>
    </g>
    <!-- Sparkle -->
    <path d="M152 46 L155 38 L158 46 L166 49 L158 52 L155 60 L152 52 L144 49 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
