<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="empGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="empGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="empShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#empGlow)"/>
  <g filter="url(#empShadow)">
    <g transform="rotate(-4 100 100)">
      <!-- 3D Outer Avatar Circle -->
      <circle cx="100" cy="100" r="48" fill="url(#empGrad)"/>
      <circle cx="100" cy="100" r="42" fill="#ffffff" opacity="0.95"/>
      <!-- User Head -->
      <circle cx="100" cy="85" r="15" fill="#3b82f6"/>
      <!-- User Body -->
      <path d="M72 125 C72 108 84 105 100 105 C116 105 128 108 128 125 Z" fill="#3b82f6"/>
      <!-- Badge Star/Check in Corner -->
      <circle cx="128" cy="74" r="11" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M123 74 L127 78 L134 70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
