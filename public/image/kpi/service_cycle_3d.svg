<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cycGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="cycShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#cycGlow)"/>
  <g filter="url(#cycShadow)">
    <g transform="rotate(-4 100 100)">
      <!-- Calendar Body -->
      <rect x="44" y="58" width="112" height="96" rx="16" fill="url(#calBody)"/>
      
      <!-- Calendar Header Band -->
      <path d="M44 74 C44 65 51 58 60 58 L140 58 C149 58 156 65 156 74 L156 86 L44 86 Z" fill="url(#calTop)"/>
      
      <!-- Binder Rings -->
      <rect x="68" y="46" width="10" height="22" rx="5" fill="#93c5fd"/>
      <rect x="68" y="46" width="10" height="22" rx="5" fill="none" stroke="#1e40af" stroke-width="1.5"/>
      <rect x="122" y="46" width="10" height="22" rx="5" fill="#93c5fd"/>
      <rect x="122" y="46" width="10" height="22" rx="5" fill="none" stroke="#1e40af" stroke-width="1.5"/>
      
      <!-- Checkmark badge in center -->
      <circle cx="100" cy="118" r="22" fill="#dbeafe"/>
      <path d="M88 118 L96 126 L114 108" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M88 118 L96 126 L114 108" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Orbit Arrows for Cycle -->
      <path d="M60 114 A40 40 0 0 1 100 78" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
      <path d="M140 122 A40 40 0 0 1 100 158" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    </g>
    <!-- Sparkle -->
    <path d="M152 46 L155 38 L158 46 L166 49 L158 52 L155 60 L152 52 L144 49 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
