<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="accGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accOct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#accGlow)"/>
  <g filter="url(#accShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- 3D Octagon Base -->
      <polygon points="70,45 130,45 165,80 165,140 130,175 70,175 35,140 35,80" fill="url(#accOct)"/>
      <polygon points="73,50 127,50 159,82 159,138 127,170 73,170 41,138 41,82" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
      <!-- Exclamation Mark Inside -->
      <path d="M100 75 L100 120" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
      <circle cx="100" cy="144" r="6.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
