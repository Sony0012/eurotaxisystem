<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="fricGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warnTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="warnPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="fricShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#fricGlow)"/>
  <g filter="url(#fricShadow)">
    <g transform="rotate(4 100 100)">
      <!-- Outer 3D Warning Triangle with rounded vertices -->
      <path d="M100 48 C105 48 109 51 112 56 L156 134 C159 139 157 146 151 149 C148 150 145 150 143 150 L57 150 C51 150 46 145 46 139 C46 137 47 135 48 134 L92 56 C94 51 97 48 100 48 Z" fill="url(#warnTri)"/>
      
      <!-- Inner Triangle Inset -->
      <path d="M100 62 L138 136 L62 136 Z" fill="url(#warnPlate)"/>
      
      <!-- Exclamation Mark -->
      <path d="M100 80 L100 110" stroke="#be123c" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 80 L100 110" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="100" cy="124" r="4.5" fill="#be123c"/>
      <circle cx="100" cy="124" r="2.5" fill="#f43f5e"/>
    </g>
    <!-- Sparkle -->
    <path d="M152 46 L155 38 L158 46 L166 49 L158 52 L155 60 L152 52 L144 49 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
