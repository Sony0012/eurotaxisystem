<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="boxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#boxGlow)"/>
  <g filter="url(#boxShadow)">
    <g transform="rotate(-4 100 100)">
      <!-- Isometric Box Top Face -->
      <polygon points="100,50 148,76 100,102 52,76" fill="url(#boxTop)"/>
      <line x1="100" y1="50" x2="100" y2="102" stroke="#d97706" stroke-width="3"/>
      <!-- Tape on Top -->
      <polygon points="90,56 110,67 110,96 90,85" fill="#fef08a" opacity="0.8"/>
      <!-- Isometric Box Left Face -->
      <polygon points="52,76 100,102 100,154 52,128" fill="url(#boxLeft)"/>
      <!-- Isometric Box Right Face -->
      <polygon points="100,102 148,76 148,128 100,154" fill="url(#boxRight)"/>
      <!-- Gear / Tool Stamp on front -->
      <circle cx="76" cy="115" r="10" fill="#fef3c7" opacity="0.9"/>
      <path d="M72 115 L80 115 M76 111 L76 119" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
