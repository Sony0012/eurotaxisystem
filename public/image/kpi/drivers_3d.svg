<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="drvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="drvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#drvGlow)"/>
  <g filter="url(#drvShadow)">
    <!-- 3D Driver Shield Badge -->
    <path d="M100 45 L150 65 C150 115 100 150 100 150 C100 150 50 115 50 65 Z" fill="url(#shieldGrad)"/>
    <path d="M100 52 L142 69 C142 110 100 140 100 140 C100 140 58 110 58 69 Z" fill="#ffffff" opacity="0.2"/>
    <!-- 3D Steering Wheel / User Badge -->
    <circle cx="100" cy="95" r="26" fill="url(#wheelGrad)" stroke="#e0e7ff" stroke-width="4"/>
    <circle cx="100" cy="95" r="10" fill="#e0e7ff"/>
    <!-- Steering Spokes -->
    <rect x="97" y="72" width="6" height="15" rx="3" fill="#e0e7ff"/>
    <rect x="76" y="93" width="15" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="109" y="93" width="15" height="6" rx="3" fill="#e0e7ff"/>
    <!-- Verification Checkmark / Star -->
    <circle cx="138" cy="65" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
    <path d="M132 65 L136 69 L144 61" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
