<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="crownGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="velvetBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="crownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350f" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#crownGlow)"/>
  <g filter="url(#crownShadow)">
    <g transform="rotate(-3 100 100)">
      <!-- Velvet Cushion -->
      <path d="M52 118 C52 82 148 82 148 118 Z" fill="url(#velvetBase)"/>
      <!-- Main Gold Crown Body -->
      <path d="M44 128 L50 78 L80 102 L100 62 L120 102 L150 78 L156 128 Z" fill="url(#goldCrown)"/>
      <!-- Crown Bottom Rim Band -->
      <rect x="40" y="124" width="120" height="24" rx="12" fill="url(#goldTrim)"/>
      <rect x="44" y="128" width="112" height="16" rx="8" fill="#b45309" opacity="0.3"/>
      <!-- Gemstones on Rim -->
      <circle cx="60" cy="136" r="5" fill="#ef4444"/>
      <circle cx="60" cy="136" r="2" fill="#ffffff"/>
      <circle cx="80" cy="136" r="4.5" fill="#3b82f6"/>
      <circle cx="80" cy="136" r="1.5" fill="#ffffff"/>
      <circle cx="100" cy="136" r="6" fill="#10b981"/>
      <circle cx="100" cy="136" r="2" fill="#ffffff"/>
      <circle cx="120" cy="136" r="4.5" fill="#3b82f6"/>
      <circle cx="120" cy="136" r="1.5" fill="#ffffff"/>
      <circle cx="140" cy="136" r="5" fill="#ef4444"/>
      <circle cx="140" cy="136" r="2" fill="#ffffff"/>
      <!-- Crown Top Spire Pearls -->
      <circle cx="50" cy="78" r="8" fill="url(#goldTrim)"/>
      <circle cx="50" cy="78" r="3" fill="#ffffff"/>
      <circle cx="100" cy="62" r="11" fill="url(#goldTrim)"/>
      <circle cx="100" cy="62" r="4" fill="#ffffff"/>
      <circle cx="150" cy="78" r="8" fill="url(#goldTrim)"/>
      <circle cx="150" cy="78" r="3" fill="#ffffff"/>
      <!-- Sparkle -->
      <path d="M152 48 L155 40 L158 48 L166 51 L158 54 L155 62 L152 54 L144 51 Z" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>
</svg>
