<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="invGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="invShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#invGlow)"/>
  <g filter="url(#invShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- Isometric Box Top -->
      <polygon points="100,50 148,74 100,98 52,74" fill="url(#boxTop)"/>
      <!-- Isometric Box Left -->
      <polygon points="52,74 100,98 100,150 52,126" fill="url(#boxLeft)"/>
      <!-- Isometric Box Right -->
      <polygon points="100,98 148,74 148,126 100,150" fill="url(#boxRight)"/>
      <!-- Tape / Seam -->
      <path d="M100 50 L100 98" stroke="#ca8a04" stroke-width="4"/>
      <path d="M76 62 L124 86" stroke="#ca8a04" stroke-width="4"/>
    </g>
  </g>
</svg>
