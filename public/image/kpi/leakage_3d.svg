<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="leakGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leakDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="leakShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#leakGlow)"/>
  <g filter="url(#leakShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- 3D Base Badge -->
      <rect x="52" y="52" width="96" height="96" rx="28" fill="url(#leakDisc)"/>
      <rect x="58" y="58" width="84" height="84" rx="22" fill="#ffffff" opacity="0.95"/>
      <!-- Downward Trend Graph & Arrow -->
      <rect x="68" y="70" width="12" height="60" rx="4" fill="#f43f5e"/>
      <rect x="86" y="84" width="12" height="46" rx="4" fill="#fb7185"/>
      <rect x="104" y="98" width="12" height="32" rx="4" fill="#fda4af"/>
      <rect x="122" y="112" width="12" height="18" rx="4" fill="#fecdd3"/>
      <!-- Falling Arrow Curve -->
      <path d="M68 68 L92 86 L110 82 L134 112" stroke="#e11d48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="126,114 138,114 138,102" fill="#e11d48"/>
    </g>
  </g>
</svg>
