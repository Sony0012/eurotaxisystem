<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="avgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calcBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="avgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#avgGlow)"/>
  <g filter="url(#avgShadow)">
    <g transform="rotate(-5 100 100)">
      <!-- Calculator Body -->
      <rect x="54" y="48" width="92" height="104" rx="16" fill="url(#calcBody)"/>
      <!-- Screen -->
      <rect x="64" y="60" width="72" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
      <text x="128" y="76" font-size="13" font-weight="bold" fill="#059669" text-anchor="end" font-family="monospace">₱ AVG</text>
      <!-- Keypad Grid -->
      <circle cx="74" cy="98" r="6" fill="#a7f3d0"/>
      <circle cx="92" cy="98" r="6" fill="#a7f3d0"/>
      <circle cx="110" cy="98" r="6" fill="#a7f3d0"/>
      <circle cx="128" cy="98" r="6" fill="#34d399"/>
      <circle cx="74" cy="116" r="6" fill="#a7f3d0"/>
      <circle cx="92" cy="116" r="6" fill="#a7f3d0"/>
      <circle cx="110" cy="116" r="6" fill="#a7f3d0"/>
      <circle cx="128" cy="116" r="6" fill="#34d399"/>
      <rect x="68" y="128" width="40" height="12" rx="6" fill="#a7f3d0"/>
      <circle cx="128" cy="134" r="6" fill="#fde047"/>
    </g>
  </g>
</svg>
