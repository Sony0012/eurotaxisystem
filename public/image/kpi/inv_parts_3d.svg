<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="invPartsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="invBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="invBoxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="invBoxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="invPartsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#172554" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#invPartsGlow)"/>
  <g filter="url(#invPartsShadow)">
    <g transform="rotate(-5 100 100)">
      <!-- Isometric Top Face -->
      <polygon points="100,50 148,76 100,102 52,76" fill="url(#invBoxTop)"/>
      <!-- Top Center Seam -->
      <line x1="100" y1="50" x2="100" y2="102" stroke="#1d4ed8" stroke-width="2.5"/>
      <!-- Sealing Tape -->
      <polygon points="88,56 112,69 112,96 88,83" fill="#ffffff" opacity="0.45"/>
      <!-- Isometric Left Face -->
      <polygon points="52,76 100,102 100,154 52,128" fill="url(#invBoxLeft)"/>
      <!-- Shipping Label on Left Face -->
      <polygon points="62,94 88,108 88,128 62,114" fill="#ffffff" opacity="0.95"/>
      <line x1="68" y1="103" x2="82" y2="111" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="110" x2="82" y2="118" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Isometric Right Face -->
      <polygon points="100,102 148,76 148,128 100,154" fill="url(#invBoxRight)"/>
      <!-- Floating Sparkle -->
      <path d="M148 58 L152 48 L156 58 L166 62 L156 66 L152 76 L148 66 L138 62 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
