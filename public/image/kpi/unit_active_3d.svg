<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="actGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carGreenBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="carGreenRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="carWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#actGlow)"/>
  <g filter="url(#carShadow)">
    <!-- Shadow Base -->
    <ellipse cx="100" cy="155" rx="70" ry="14" fill="#064e3b" opacity="0.3"/>
    <!-- Wheels -->
    <ellipse cx="58" cy="140" rx="16" ry="18" fill="url(#carWheel)"/>
    <ellipse cx="58" cy="140" rx="8" ry="9" fill="#94a3b8"/>
    <circle cx="58" cy="140" r="4" fill="#f8fafc"/>
    <ellipse cx="142" cy="140" rx="16" ry="18" fill="url(#carWheel)"/>
    <ellipse cx="142" cy="140" rx="8" ry="9" fill="#94a3b8"/>
    <circle cx="142" cy="140" r="4" fill="#f8fafc"/>
    <!-- Car Lower Chassis -->
    <rect x="30" y="96" width="140" height="42" rx="18" fill="url(#carGreenBody)"/>
    <!-- Car Upper Cabin -->
    <path d="M52 96 L70 58 Q76 52 86 52 L124 52 Q134 52 140 62 L152 96 Z" fill="url(#carGreenRoof)"/>
    <!-- Windows -->
    <path d="M72 61 L88 61 L88 92 L56 92 Z" fill="url(#carGlass)"/>
    <path d="M94 61 L122 61 L122 92 L94 92 Z" fill="url(#carGlass)"/>
    <path d="M128 61 L136 70 L146 92 L128 92 Z" fill="url(#carGlass)"/>
    <!-- Taxi Light Sign -->
    <rect x="86" y="40" width="28" height="12" rx="4" fill="#fbbf24"/>
    <rect x="90" y="42" width="20" height="8" rx="2" fill="#fffbeb"/>
    <!-- Headlights & Taillights -->
    <circle cx="36" cy="110" r="6" fill="#fef08a"/>
    <circle cx="164" cy="110" r="5" fill="#f87171"/>
    <!-- Gloss Highlight -->
    <path d="M40 102 Q100 98 160 102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Active Sparkle -->
  <path d="M152 44 L155 36 L158 44 L166 47 L158 50 L155 58 L152 50 L144 47 Z" fill="#ffffff" opacity="0.95"/>
</svg>
