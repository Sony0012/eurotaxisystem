<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="histGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#93c5fd"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Clock Ring Gradient -->
    <linearGradient id="clockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Document Plate Gradient -->
    <linearGradient id="docPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- 3D Shadow -->
    <filter id="histShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="100" cy="105" r="90" fill="url(#histGlow)"/>

  <!-- Main 3D Composition -->
  <g filter="url(#histShadow)">
    
    <!-- 3D Background Shield / Base Plate -->
    <g transform="rotate(-6 100 100)">
      <!-- Back Shield Rim -->
      <path d="M100 28 L154 48 C154 112 100 156 100 156 C100 156 46 112 46 48 Z" fill="#1e3a8a" opacity="0.6"/>
      <path d="M100 32 L150 50 C150 110 100 150 100 150 C100 150 50 110 50 50 Z" fill="url(#shieldFace)"/>
      <path d="M100 38 L144 54 C144 106 100 142 100 142 C100 142 56 106 56 54 Z" fill="#0f172a" opacity="0.85"/>
    </g>

    <!-- Foreground 3D Clock / History Disc -->
    <g transform="translate(10, 5)">
      <!-- Golden Outer Ring -->
      <circle cx="95" cy="95" r="50" fill="url(#clockRing)"/>
      <circle cx="95" cy="95" r="44" fill="#ffffff"/>
      
      <!-- Inner Clock Face -->
      <circle cx="95" cy="95" r="40" fill="#f8fafc"/>
      
      <!-- Clock Ticks -->
      <circle cx="95" cy="60" r="2.5" fill="#f59e0b"/>
      <circle cx="130" cy="95" r="2.5" fill="#f59e0b"/>
      <circle cx="95" cy="130" r="2.5" fill="#f59e0b"/>
      <circle cx="60" cy="95" r="2.5" fill="#f59e0b"/>

      <!-- Reverse History Arrow (Rewind / Audit Trace) -->
      <path d="M85 70 A 30 30 0 1 1 65 95" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <polygon points="85,62 85,76 72,70" fill="#3b82f6"/>

      <!-- Clock Hands -->
      <!-- Hour Hand -->
      <line x1="95" y1="95" x2="80" y2="82" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Minute Hand -->
      <line x1="95" y1="95" x2="114" y2="76" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Center Pin -->
      <circle cx="95" cy="95" r="5" fill="#1e293b"/>
      <circle cx="95" cy="95" r="2" fill="#ffffff"/>
    </g>

    <!-- Floating Activity Hologram Lines -->
    <g transform="translate(110, 115)">
      <rect x="0" y="0" width="48" height="28" rx="8" fill="#ffffff" filter="url(#histShadow)"/>
      <rect x="0" y="0" width="48" height="28" rx="8" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="8" y1="9" x2="28" y2="9" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="40" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="9" r="3" fill="#22c55e"/>
    </g>

  </g>
</svg>
