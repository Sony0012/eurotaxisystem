<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="todayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="todayClock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="todayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#todayGlow)"/>
  <g filter="url(#todayShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- 3D Outer Clock Ring -->
      <circle cx="100" cy="100" r="48" fill="url(#todayClock)"/>
      <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.9"/>
      <!-- Clock Markers & Hands -->
      <circle cx="100" cy="100" r="4" fill="#f97316"/>
      <path d="M100 100 L100 76" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
      <path d="M100 100 L118 100" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
      <!-- Top Push Button -->
      <rect x="94" y="44" width="12" height="8" rx="3" fill="#fdba74"/>
    </g>
  </g>
</svg>
