<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="qGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gaugeArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gaugeDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="qShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#qGlow)"/>
  <g filter="url(#qShadow)">
    <!-- Speedometer Gauge Dial -->
    <circle cx="100" cy="104" r="54" fill="url(#gaugeDial)"/>
    <circle cx="100" cy="104" r="50" fill="none" stroke="url(#gaugeArc)" stroke-width="6" stroke-dasharray="190 70" stroke-linecap="round" transform="rotate(135 100 104)"/>
    
    <!-- Tick Marks -->
    <line x1="58" y1="104" x2="66" y2="104" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="62" x2="100" y2="70" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="142" y1="104" x2="134" y2="104" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Quality Star -->
    <path d="M100 76 L103 84 L111 85 L105 90 L107 98 L100 94 L93 98 L95 90 L89 85 L97 84 Z" fill="#fbbf24"/>
    
    <!-- Needle Pivot & Needle -->
    <path d="M100 104 L126 84" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="104" r="9" fill="#e2e8f0"/>
    <circle cx="100" cy="104" r="5" fill="#8b5cf6"/>
    
    <!-- Sparkle -->
    <path d="M152 46 L155 38 L158 46 L166 49 L158 52 L155 60 L152 52 L144 49 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
