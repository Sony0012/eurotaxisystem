<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="ongGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wrenchPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gearIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="ongShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#ongGlow)"/>
  <g filter="url(#ongShadow)">
    <!-- Rotating Gear in background -->
    <g transform="translate(62, 54)">
      <circle cx="45" cy="45" r="34" fill="url(#gearIndigo)"/>
      <rect x="38" y="2" width="14" height="12" rx="3" fill="#6366f1"/>
      <rect x="38" y="76" width="14" height="12" rx="3" fill="#4338ca"/>
      <rect x="2" y="38" width="12" height="14" rx="3" fill="#6366f1"/>
      <rect x="76" y="38" width="12" height="14" rx="3" fill="#4338ca"/>
      <g transform="rotate(45 45 45)">
        <rect x="38" y="2" width="14" height="12" rx="3" fill="#6366f1"/>
        <rect x="38" y="76" width="14" height="12" rx="3" fill="#4338ca"/>
        <rect x="2" y="38" width="12" height="14" rx="3" fill="#6366f1"/>
        <rect x="76" y="38" width="12" height="14" rx="3" fill="#4338ca"/>
      </g>
      <circle cx="45" cy="45" r="16" fill="#ffffff" opacity="0.95"/>
      <circle cx="45" cy="45" r="10" fill="#312e81"/>
    </g>

    <!-- Crossing Wrench & Screwdriver in foreground -->
    <g transform="rotate(38 108 106)">
      <!-- Wrench Handle -->
      <rect x="98" y="42" width="18" height="92" rx="9" fill="url(#wrenchPurple)"/>
      <!-- Open Head -->
      <circle cx="107" cy="44" r="20" fill="url(#wrenchPurple)"/>
      <polygon points="99,32 115,32 111,46 103,46" fill="#4c1d95"/>
      <!-- Ring Head -->
      <circle cx="107" cy="132" r="15" fill="url(#wrenchPurple)"/>
      <circle cx="107" cy="132" r="7" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Motion Sparkle -->
    <path d="M148 64 L152 54 L156 64 L166 68 L156 72 L152 82 L148 72 L138 68 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
