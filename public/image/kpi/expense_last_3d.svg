<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="lastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lastCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="lastShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#lastGlow)"/>
  <g filter="url(#lastShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- Outer Counterclockwise Arc -->
      <circle cx="100" cy="100" r="48" fill="url(#lastCircle)"/>
      <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.9"/>
      <!-- History Rewind Arrow & Clock Hands -->
      <path d="M78 95 A26 26 0 1 1 100 126" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <polygon points="72,88 84,94 74,102" fill="#64748b"/>
      <path d="M100 100 L100 84" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M100 100 L112 100" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
