<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="avgUnitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avgUnitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="avgUnitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#avgUnitGlow)"/>
  <g filter="url(#avgUnitShadow)">
    <g transform="rotate(-5 100 100)">
      <!-- 3D Base Badge -->
      <rect x="52" y="52" width="96" height="96" rx="28" fill="url(#avgUnitGrad)"/>
      <rect x="58" y="58" width="84" height="84" rx="22" fill="#ffffff" opacity="0.95"/>
      <!-- Taxi Silhouette / Front -->
      <rect x="68" y="90" width="64" height="34" rx="8" fill="#8b5cf6"/>
      <path d="M76 90 L84 74 L116 74 L124 90 Z" fill="#7c3aed"/>
      <circle cx="78" cy="124" r="7" fill="#4c1d95"/>
      <circle cx="122" cy="124" r="7" fill="#4c1d95"/>
      <circle cx="78" cy="100" r="4" fill="#fde047"/>
      <circle cx="122" cy="100" r="4" fill="#fde047"/>
      <!-- Star on Top -->
      <circle cx="100" cy="62" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
      <text x="100" y="67" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">★</text>
    </g>
  </g>
</svg>
