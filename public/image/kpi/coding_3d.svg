<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="codeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="codeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#codeGlow)"/>
  <g filter="url(#codeShadow)">
    <!-- 3D Calendar Tile -->
    <g transform="rotate(-6 100 105)">
      <!-- Calendar Body -->
      <rect x="50" y="60" width="100" height="90" rx="14" fill="url(#calBody)"/>
      <!-- Calendar Top Header -->
      <path d="M50 74 C50 66 56 60 64 60 L136 60 C144 60 150 66 150 74 L150 84 L50 84 Z" fill="url(#calHeader)"/>
      <!-- Binder Rings -->
      <rect x="70" y="52" width="8" height="16" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <rect x="122" y="52" width="8" height="16" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <!-- Calendar Grid Dots -->
      <circle cx="72" cy="102" r="5" fill="#c4b5fd"/>
      <circle cx="95" cy="102" r="5" fill="#c4b5fd"/>
      <circle cx="118" cy="102" r="5" fill="#c4b5fd"/>
      <circle cx="140" cy="102" r="5" fill="#c4b5fd"/>
      <circle cx="72" cy="124" r="5" fill="#c4b5fd"/>
      <circle cx="95" cy="124" r="5" fill="#c4b5fd"/>
      <!-- Highlighted Coding Day Badge -->
      <rect x="114" y="116" width="28" height="24" rx="8" fill="url(#badgeGrad)"/>
      <circle cx="128" cy="128" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
