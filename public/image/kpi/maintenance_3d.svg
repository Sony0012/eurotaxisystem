<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="maintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="maintShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#maintGlow)"/>
  <g filter="url(#maintShadow)">
    <!-- 3D Big Gear -->
    <g transform="translate(60, 50)">
      <circle cx="50" cy="50" r="38" fill="url(#gearGrad)"/>
      <!-- Gear Teeth -->
      <rect x="42" y="4" width="16" height="14" rx="4" fill="#fb923c"/>
      <rect x="42" y="82" width="16" height="14" rx="4" fill="#ea580c"/>
      <rect x="4" y="42" width="14" height="16" rx="4" fill="#fb923c"/>
      <rect x="82" y="42" width="14" height="16" rx="4" fill="#ea580c"/>
      <g transform="rotate(45 50 50)">
        <rect x="42" y="4" width="16" height="14" rx="4" fill="#fb923c"/>
        <rect x="42" y="82" width="16" height="14" rx="4" fill="#ea580c"/>
        <rect x="4" y="42" width="14" height="16" rx="4" fill="#fb923c"/>
        <rect x="82" y="42" width="14" height="16" rx="4" fill="#ea580c"/>
      </g>
      <circle cx="50" cy="50" r="18" fill="#ffffff" opacity="0.9"/>
      <circle cx="50" cy="50" r="12" fill="#c2410c"/>
    </g>
    <!-- 3D Crossing Wrench -->
    <g transform="rotate(35 110 110)">
      <rect x="100" y="45" width="20" height="90" rx="10" fill="url(#wrenchGrad)"/>
      <circle cx="110" cy="45" r="22" fill="url(#wrenchGrad)"/>
      <circle cx="110" cy="45" r="10" fill="#ffffff" opacity="0.9"/>
      <circle cx="110" cy="135" r="16" fill="url(#wrenchGrad)"/>
      <circle cx="110" cy="135" r="7" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
