<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="expGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="downArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="expShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#expGlow)"/>
  <g filter="url(#expShadow)">
    <!-- 3D Receipt Card -->
    <g transform="rotate(-8 95 105)">
      <rect x="52" y="60" width="85" height="95" rx="10" fill="url(#receiptGrad)"/>
      <rect x="62" y="75" width="45" height="6" rx="3" fill="#fb7185" opacity="0.8"/>
      <rect x="62" y="88" width="65" height="4" rx="2" fill="#fda4af"/>
      <rect x="62" y="98" width="55" height="4" rx="2" fill="#fda4af"/>
      <rect x="62" y="108" width="40" height="4" rx="2" fill="#fda4af"/>
      <line x1="60" y1="122" x2="128" y2="122" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3"/>
      <rect x="62" y="130" width="30" height="8" rx="3" fill="#e11d48"/>
    </g>
    <!-- 3D Downward Trend Arrow -->
    <g transform="translate(10, 15)">
      <path d="M55 70 Q95 85 135 125" stroke="url(#downArrowGrad)" stroke-width="8" stroke-linecap="round"/>
      <path d="M142 108 L144 136 L116 132 Z" fill="#e11d48"/>
      <circle cx="140" cy="132" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
