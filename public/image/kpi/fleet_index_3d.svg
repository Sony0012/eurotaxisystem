<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="tgtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="tgtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#075985" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#tgtGlow)"/>
  <g filter="url(#tgtShadow)">
    <g transform="rotate(-6 100 100)">
      <!-- Outer Concentric Ring -->
      <circle cx="100" cy="100" r="54" fill="url(#ringCyan)"/>
      <circle cx="100" cy="100" r="44" fill="#0f172a"/>
      
      <!-- Middle Concentric Ring -->
      <circle cx="100" cy="100" r="34" fill="url(#ringCyan)"/>
      <circle cx="100" cy="100" r="26" fill="#0f172a"/>
      
      <!-- Center Bullseye Ring -->
      <circle cx="100" cy="100" r="16" fill="url(#ringGold)"/>
      <circle cx="100" cy="100" r="8" fill="#ffffff"/>
      
      <!-- Radar Crosshairs -->
      <line x1="100" y1="36" x2="100" y2="164" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="36" y1="100" x2="164" y2="100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Sparkle -->
    <path d="M152 48 L155 40 L158 48 L166 51 L158 54 L155 62 L152 54 L144 51 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
