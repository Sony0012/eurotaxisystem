<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="pendGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="clockFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="pendShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#pendGlow)"/>
  <g filter="url(#pendShadow)">
    <g transform="rotate(6 100 100)">
      <!-- Top Alarm Bell Buttons -->
      <circle cx="68" cy="58" r="14" fill="url(#clockGold)"/>
      <circle cx="132" cy="58" r="14" fill="url(#clockGold)"/>
      <!-- Clock Feet -->
      <rect x="62" y="142" width="12" height="18" rx="6" fill="#b45309" transform="rotate(-25 68 151)"/>
      <rect x="126" y="142" width="12" height="18" rx="6" fill="#b45309" transform="rotate(25 132 151)"/>
      <!-- Outer Rim -->
      <circle cx="100" cy="104" r="54" fill="url(#clockGold)"/>
      <circle cx="100" cy="104" r="46" fill="url(#clockFace)"/>
      <!-- Clock Markers -->
      <circle cx="100" cy="68" r="3" fill="#d97706"/>
      <circle cx="136" cy="104" r="3" fill="#d97706"/>
      <circle cx="100" cy="140" r="3" fill="#d97706"/>
      <circle cx="64" cy="104" r="3" fill="#d97706"/>
      <!-- Clock Hands pointing to pending time -->
      <line x1="100" y1="104" x2="100" y2="82" stroke="#92400e" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="100" y1="104" x2="118" y2="104" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Center Pin -->
      <circle cx="100" cy="104" r="5" fill="#78350f"/>
      <circle cx="100" cy="104" r="2" fill="#ffffff"/>
      <!-- Small Waiting / Exclamation Badge -->
      <circle cx="136" cy="74" r="12" fill="#ef4444"/>
      <text x="136" y="79" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">!</text>
    </g>
  </g>
</svg>
