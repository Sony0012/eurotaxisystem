<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="disqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disqCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="disqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#disqGlow)"/>
  <g filter="url(#disqShadow)">
    <!-- 3D Outer Ring -->
    <circle cx="100" cy="100" r="55" fill="none" stroke="#fecaca" stroke-width="4" opacity="0.6"/>
    <!-- 3D Main Red Disc -->
    <circle cx="100" cy="100" r="45" fill="url(#disqCircle)"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.4"/>
    <!-- 3D White X Mark -->
    <path d="M82 82 L118 118" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M118 82 L82 118" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
