<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="tktGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ticketTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="tktShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#78350f" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="100" cy="105" r="85" fill="url(#tktGlow)"/>
  <g filter="url(#tktShadow)">
    <g transform="rotate(-12 100 100)">
      <!-- Ticket Body with Perforation cutouts -->
      <path d="M42 66 C42 60 46 56 52 56 L148 56 C154 56 158 60 158 66 L158 92 C150 92 144 98 144 105 C144 112 150 118 158 118 L158 144 C158 150 154 154 148 154 L52 154 C46 154 42 150 42 144 L42 118 C50 118 56 112 56 105 C56 98 50 92 42 92 Z" fill="url(#ticketGold)"/>
      
      <!-- Inner Border -->
      <path d="M50 64 L150 64 L150 88 C142 91 136 97 136 105 C136 113 142 119 150 122 L150 146 L50 146 L50 122 C58 119 64 113 64 105 C64 97 58 91 50 88 Z" fill="none" stroke="url(#ticketTrim)" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>

      <!-- Center Star Badge -->
      <circle cx="100" cy="105" r="20" fill="#ffffff" opacity="0.95"/>
      <path d="M100 92 L103.5 100 L112 101 L106 107 L107.5 116 L100 111.5 L92.5 116 L94 107 L88 101 L96.5 100 Z" fill="#d97706"/>
      
      <!-- Text Labels -->
      <text x="100" y="78" font-size="9" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif" letter-spacing="1">FREE PASS</text>
      <text x="100" y="136" font-size="8" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif" letter-spacing="1">CODING EXEMPT</text>
      
      <!-- Barcode Accent -->
      <line x1="68" y1="96" x2="68" y2="114" stroke="#78350f" stroke-width="2"/>
      <line x1="72" y1="96" x2="72" y2="114" stroke="#78350f" stroke-width="1"/>
      <line x1="75" y1="96" x2="75" y2="114" stroke="#78350f" stroke-width="3"/>
      <line x1="80" y1="96" x2="80" y2="114" stroke="#78350f" stroke-width="1.5"/>
    </g>
    <!-- Sparkle -->
    <path d="M152 46 L155 38 L158 46 L166 49 L158 52 L155 60 L152 52 L144 49 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
