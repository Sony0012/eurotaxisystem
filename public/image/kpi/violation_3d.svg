<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="violGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="triWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="violShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#violGlow)"/>
  <g filter="url(#violShadow)">
    <!-- 3D Red Caution Shield Badge -->
    <path d="M100 45 L150 65 C150 115 100 150 100 150 C100 150 50 115 50 65 Z" fill="url(#shieldRed)"/>
    <path d="M100 52 L142 69 C142 110 100 140 100 140 C100 140 58 110 58 69 Z" fill="#ffffff" opacity="0.25"/>
    <!-- 3D Inner Warning Triangle -->
    <path d="M100 70 L126 116 C128 120 125 124 120 124 L80 124 C75 124 72 120 74 116 Z" fill="url(#triWarn)"/>
    <!-- Exclamation Mark -->
    <rect x="97" y="82" width="6" height="20" rx="3" fill="#b91c1c"/>
    <circle cx="100" cy="112" r="3.5" fill="#b91c1c"/>
  </g>
</svg>
