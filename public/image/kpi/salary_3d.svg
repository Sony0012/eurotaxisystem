<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="salGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="salBill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="salShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#14532d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#salGlow)"/>
  <g filter="url(#salShadow)">
    <!-- Back Bill -->
    <g transform="rotate(12 100 100)">
      <rect x="45" y="70" width="110" height="60" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    </g>
    <!-- Front Bill -->
    <g transform="rotate(-6 100 100)">
      <rect x="45" y="70" width="110" height="60" rx="10" fill="url(#salBill)"/>
      <rect x="52" y="76" width="96" height="48" rx="6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <circle cx="100" cy="100" r="16" fill="#ffffff" opacity="0.9"/>
      <text x="100" y="106" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle" font-family="sans-serif">₱</text>
    </g>
  </g>
</svg>
