<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="revGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="revShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#065f46" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#revGlow)"/>
  <g filter="url(#revShadow)">
    <!-- Back Bill -->
    <g transform="rotate(-15 90 120)">
      <rect x="40" y="80" width="110" height="65" rx="10" fill="url(#bill1)"/>
      <rect x="46" y="86" width="98" height="53" rx="6" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>
      <circle cx="95" cy="112" r="14" fill="#047857" opacity="0.4"/>
      <circle cx="95" cy="112" r="10" fill="#a7f3d0" opacity="0.6"/>
    </g>
    <!-- Front Bill -->
    <g transform="rotate(8 110 110)">
      <rect x="55" y="70" width="115" height="70" rx="12" fill="url(#bill2)"/>
      <rect x="62" y="77" width="101" height="56" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
      <circle cx="112" cy="105" r="16" fill="#047857" opacity="0.3"/>
      <text x="112" y="112" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">₱</text>
    </g>
    <!-- 3D Gold Coin 1 -->
    <g transform="translate(130, 115)">
      <ellipse cx="16" cy="16" rx="16" ry="16" fill="url(#goldCoin)"/>
      <ellipse cx="16" cy="16" rx="12" ry="12" fill="none" stroke="#fef08a" stroke-width="2"/>
      <text x="16" y="22" font-size="14" font-weight="bold" fill="#713f12" text-anchor="middle" font-family="sans-serif">₱</text>
    </g>
    <!-- 3D Gold Coin 2 -->
    <g transform="translate(35, 125)">
      <ellipse cx="12" cy="12" rx="12" ry="12" fill="url(#goldCoin)"/>
      <ellipse cx="12" cy="12" rx="9" ry="9" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    </g>
  </g>
</svg>
