<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="payGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a16207" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="calGoldHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="payShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#payGlow)"/>
  <g filter="url(#payShadow)">
    <g transform="rotate(-4 100 105)">
      <!-- Calendar Body -->
      <rect x="50" y="60" width="100" height="90" rx="14" fill="url(#calGold)"/>
      <!-- Calendar Top Header -->
      <path d="M50 74 C50 66 56 60 64 60 L136 60 C144 60 150 66 150 74 L150 84 L50 84 Z" fill="url(#calGoldHeader)"/>
      <!-- Binder Rings -->
      <rect x="70" y="52" width="8" height="16" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
      <rect x="122" y="52" width="8" height="16" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
      <!-- Calendar Checkmark Badge -->
      <circle cx="100" cy="116" r="20" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
      <path d="M92 116 L97 121 L108 110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
