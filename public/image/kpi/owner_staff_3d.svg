<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="staffGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="userAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="userBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="staffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#staffGlow)"/>
  <g filter="url(#staffShadow)">
    <g transform="translate(10, 0)">
      <!-- Background User Avatar -->
      <g transform="translate(42, 38)">
        <circle cx="28" cy="22" r="16" fill="url(#userBack)"/>
        <path d="M4 64 C4 46 52 46 52 64 Z" fill="url(#userBack)"/>
      </g>
      <!-- Foreground User Avatar -->
      <g transform="translate(70, 52)">
        <circle cx="34" cy="26" r="20" fill="url(#userAmber)"/>
        <circle cx="34" cy="26" r="16" fill="#ffffff" opacity="0.25"/>
        <path d="M6 78 C6 56 62 56 62 78 Z" fill="url(#userAmber)"/>
        <!-- Staff Badge Icon -->
        <circle cx="48" cy="62" r="10" fill="#ffffff"/>
        <circle cx="48" cy="62" r="8" fill="#d97706"/>
        <path d="M48 57 L49.5 60.5 L53 61 L50.5 63.5 L51 67 L48 65 L45 67 L45.5 63.5 L43 61 L46.5 60.5 Z" fill="#ffffff"/>
      </g>
    </g>
    <!-- Sparkle -->
    <path d="M148 56 L151 48 L154 56 L162 59 L154 62 L151 70 L148 62 L140 59 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
