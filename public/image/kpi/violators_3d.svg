<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="vtrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="userTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="userBodyTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="vtrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#134e4a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="110" r="85" fill="url(#vtrGlow)"/>
  <g filter="url(#vtrShadow)">
    <!-- 3D User Head -->
    <circle cx="100" cy="80" r="24" fill="url(#userTeal)"/>
    <circle cx="100" cy="80" r="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <!-- 3D User Torso -->
    <path d="M60 142 C60 115 80 110 100 110 C120 110 140 115 140 142 Z" fill="url(#userBodyTeal)"/>
    <!-- 3D Accent Pill / Badge -->
    <circle cx="132" cy="72" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <rect x="130.5" y="65" width="3" height="8" rx="1.5" fill="#ffffff"/>
    <circle cx="132" cy="77" r="1.5" fill="#ffffff"/>
  </g>
</svg>
