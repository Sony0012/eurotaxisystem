<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="taxiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="taxiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="taxiRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="taxiGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="taxiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Ambient Glow -->
  <circle cx="100" cy="110" r="85" fill="url(#taxiGlow)"/>
  <g filter="url(#taxiShadow)">
    <!-- Shadow Base -->
    <ellipse cx="100" cy="155" rx="70" ry="16" fill="#1e293b" opacity="0.25"/>
    <!-- Wheels -->
    <ellipse cx="60" cy="142" rx="16" ry="18" fill="url(#wheelGrad)"/>
    <ellipse cx="60" cy="142" rx="8" ry="9" fill="#94a3b8"/>
    <ellipse cx="140" cy="142" rx="16" ry="18" fill="url(#wheelGrad)"/>
    <ellipse cx="140" cy="142" rx="8" ry="9" fill="#94a3b8"/>
    <!-- Car Lower Body (3D Rounded Chassis) -->
    <rect x="32" y="98" width="136" height="42" rx="18" fill="url(#taxiBody)"/>
    <!-- Car Upper Cabin -->
    <path d="M52 98 L70 60 Q75 54 85 54 L125 54 Q135 54 140 64 L152 98 Z" fill="url(#taxiRoof)"/>
    <!-- Windshield & Windows -->
    <path d="M72 63 L88 63 L88 94 L56 94 Z" fill="url(#taxiGlass)"/>
    <path d="M94 63 L122 63 L122 94 L94 94 Z" fill="url(#taxiGlass)"/>
    <path d="M128 63 L136 72 L146 94 L128 94 Z" fill="url(#taxiGlass)"/>
    <!-- Taxi Top Light Sign -->
    <rect x="86" y="42" width="28" height="12" rx="4" fill="#fbbf24"/>
    <rect x="90" y="44" width="20" height="8" rx="2" fill="#fffbeb"/>
    <!-- Front/Rear Lights -->
    <circle cx="38" cy="112" r="6" fill="#fef08a"/>
    <circle cx="162" cy="112" r="5" fill="#f87171"/>
    <!-- Body Highlights & Gloss Line -->
    <path d="M42 104 Q100 100 158 104" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
